[project]
name = "gcp-data-platform-template"
version = "0.1.0"
description = "Reference GCP data platform: API connectors, Airflow (Composer) DAGs, idempotent BigQuery loads, data-quality gates, Terraform"
authors = [{ name = "Thanasis Zapatetas" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.20",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
airflow = ["apache-airflow==3.1.3"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
